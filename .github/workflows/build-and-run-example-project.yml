name: Build and Run Example Project

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  # Use the current GitHub workflow run ID as a temporary version number.
  smart-doc-version: ${{ github.run_id }}

jobs:

  # ============================================================
  # Build smart-doc
  # ============================================================
  build:
    name: Build smart-doc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Create Logs Directory
        shell: bash
        run: mkdir -p logs

      - name: Update Version in pom.xml
        shell: bash
        run: |
          mvn versions:set \
            -DnewVersion="${{ env.smart-doc-version }}" \
            -DgenerateBackupPoms=false

      - name: Build and Install
        shell: bash
        run: |
          set -o pipefail
          mvn install -Dmaven.test.skip=true 2>&1 | tee logs/build.log

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: smart-doc-maven-jar
          path: ~/.m2/repository/com/github/shalousun
          if-no-files-found: error

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-log-smart-doc-build
          path: logs/build.log


  # ============================================================
  # Build smart-doc-maven-plugin
  #
  # smart-doc-maven-plugin is public.
  # No repository secret is required.
  # ============================================================
  maven-plugin-build:
    name: Build Maven Plugin
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: maven-plugin-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout Maven Plugin Repository
        uses: actions/checkout@v5
        with:
          repository: smart-doc-group/smart-doc-maven-plugin
          persist-credentials: false

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Create Logs Directory
        shell: bash
        run: mkdir -p logs

      - name: Download smart-doc Artifact
        uses: actions/download-artifact@v7
        with:
          name: smart-doc-maven-jar
          path: ./artifacts

      - name: Move Files to Local Maven Repository
        shell: bash
        run: |
          TARGET_DIR="$HOME/.m2/repository/com/github/shalousun"
          
          mkdir -p "$TARGET_DIR"
          
          rsync -av --delete \
            ./artifacts/ \
            "$TARGET_DIR/"
          
          echo "Listing files in target directory:"
          ls -lh "$TARGET_DIR"

      - name: Update Version in pom.xml
        shell: bash
        run: |
          mvn versions:set-property \
            -Dproperty="smart-doc.version" \
            -DnewVersion="${{ env.smart-doc-version }}" \
            -DgenerateBackupPoms=false

      - name: Build and Install
        shell: bash
        run: |
          set -o pipefail
          mvn install -Dmaven.test.skip=true 2>&1 | tee logs/install-plugin.log

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v6
        with:
          name: smart-doc-maven-plugin-jar
          path: ~/.m2/repository/com/github/shalousun
          if-no-files-found: error

      - name: Upload Plugin Build Log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-log-maven-plugin-build
          path: logs/install-plugin.log


  # ============================================================
  # Generate REST / Dubbo / Javadoc / WebSocket API docs
  #
  # smart-doc-example-cn is public.
  # No repository secret is required.
  # ============================================================
  generate-api-docs:
    name: Generate ${{ matrix.doc_type }} API Docs
    needs: maven-plugin-build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        doc_type:
          - rest
          - dubbo
          - javadoc
          - websocket

    concurrency:
      group: generate-${{ matrix.doc_type }}-api-doc-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout Example Project
        uses: actions/checkout@v5
        with:
          repository: smart-doc-group/smart-doc-example-cn
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create Logs Directory
        shell: bash
        run: mkdir -p logs

      - name: Download Plugin Artifact
        uses: actions/download-artifact@v7
        with:
          name: smart-doc-maven-plugin-jar
          path: ./artifacts

      - name: Move Files to Local Maven Repository
        shell: bash
        run: |
          TARGET_DIR="$HOME/.m2/repository/com/github/shalousun"
          
          mkdir -p "$TARGET_DIR"
          
          rsync -av --delete \
            ./artifacts/ \
            "$TARGET_DIR/"
          
          echo "Listing files in target directory:"
          ls -lh "$TARGET_DIR"

      - name: Update Smart-Doc Version in pom.xml
        shell: bash
        run: |
          mvn versions:set-property \
            -Dproperty="smart-doc.version" \
            -DnewVersion="${{ env.smart-doc-version }}" \
            -DgenerateBackupPoms=false

      - name: Build and Install Example Project
        shell: bash
        run: |
          set -o pipefail
          mvn -Dmaven.test.skip=true install 2>&1 | tee logs/build-example-project.log

      - name: Generate API Documentation
        shell: bash
        run: |
          set -o pipefail
          
          case "${{ matrix.doc_type }}" in
          
            rest)
          
              mvn -DskipTests=true smart-doc:adoc 2>&1 \
                | tee logs/rest-adoc.log
          
              mvn -DskipTests=true smart-doc:html 2>&1 \
                | tee logs/rest-html.log
          
              mvn -DskipTests=true smart-doc:jmeter 2>&1 \
                | tee logs/rest-jmeter.log
          
              mvn -DskipTests=true smart-doc:markdown 2>&1 \
                | tee logs/rest-markdown.log
          
              mvn -DskipTests=true smart-doc:openapi 2>&1 \
                | tee logs/rest-openapi.log
          
              mvn -DskipTests=true smart-doc:postman 2>&1 \
                | tee logs/rest-postman.log
          
              mvn -DskipTests=true smart-doc:swagger 2>&1 \
                | tee logs/rest-swagger.log
          
              mvn -DskipTests=true smart-doc:word 2>&1 \
                | tee logs/rest-word.log
          
              # This is an actual test and should remain executable.
              mvn test \
                -Dtest=com.power.doc.torna.TornaApiTest 2>&1 \
                | tee logs/rest-TornaApiTest.log
          
              ;;
          
            dubbo)
          
              mvn -DskipTests=true smart-doc:rpc-adoc 2>&1 \
                | tee logs/rpc-adoc.log
          
              mvn -DskipTests=true smart-doc:rpc-html 2>&1 \
                | tee logs/rpc-html.log
          
              mvn -DskipTests=true smart-doc:rpc-markdown 2>&1 \
                | tee logs/rpc-markdown.log
          
              ;;
          
            javadoc)
          
              mvn -DskipTests=true smart-doc:javadoc-adoc 2>&1 \
                | tee logs/javadoc-adoc.log
          
              mvn -DskipTests=true smart-doc:javadoc-html 2>&1 \
                | tee logs/javadoc-html.log
          
              mvn -DskipTests=true smart-doc:javadoc-markdown 2>&1 \
                | tee logs/javadoc-markdown.log
          
              ;;
          
            websocket)
          
              mvn -DskipTests=true smart-doc:websocket-adoc 2>&1 \
                | tee logs/websocket-adoc.log
          
              mvn -DskipTests=true smart-doc:websocket-html 2>&1 \
                | tee logs/websocket-html.log
          
              mvn -DskipTests=true smart-doc:websocket-markdown 2>&1 \
                | tee logs/websocket-markdown.log
          
              ;;
          
          esac

      - name: Upload API Documentation
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.doc_type }}-api-doc
          path: ${{ github.workspace }}/target/doc/
          if-no-files-found: error

      - name: Upload API Documentation Logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-log-${{ matrix.doc_type }}-api-docs
          path: logs


  # ============================================================
  # Generate gRPC API docs
  # ============================================================
  generate-grpc-api-doc:
    name: Generate gRPC API Docs (${{ matrix.os }})
    needs: maven-plugin-build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    concurrency:
      group: generate-grpc-api-doc-${{ matrix.os }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout Example Project
        uses: actions/checkout@v5
        with:
          repository: smart-doc-group/smart-doc-example-cn
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create Logs Directory
        shell: bash
        run: mkdir -p logs

      - name: Download Plugin Artifact
        uses: actions/download-artifact@v7
        with:
          name: smart-doc-maven-plugin-jar
          path: ./artifacts

      - name: Move Files to Local Maven Repository
        shell: bash
        run: |
          TARGET_DIR="$HOME/.m2/repository/com/github/shalousun"
          
          mkdir -p "$TARGET_DIR"
          
          if [[ "${{ matrix.os }}" == "ubuntu-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
            rsync -av --delete \
              ./artifacts/ \
              "$TARGET_DIR/"
          else
            # GitHub Windows runners provide Git Bash.
            # Use $HOME so Maven and Bash resolve the same user home.
            cp -r ./artifacts/. "$TARGET_DIR/"
          fi
          
          echo "Listing files in target directory:"
          ls -lh "$TARGET_DIR"

      - name: Update Smart-Doc Version in pom.xml
        shell: bash
        run: |
          mvn versions:set-property \
            -Dproperty="smart-doc.version" \
            -DnewVersion="${{ env.smart-doc-version }}" \
            -DgenerateBackupPoms=false

      - name: Build and Install Example Project
        shell: bash
        run: |
          set -o pipefail
          mvn -Dmaven.test.skip=true install 2>&1 | tee logs/build-example-project.log

      - name: Generate gRPC AsciiDoc Documentation
        shell: bash
        run: |
          set -o pipefail
          mvn -DskipTests=true smart-doc:grpc-adoc 2>&1 \
            | tee logs/grpc-adoc.log

      - name: Generate gRPC HTML Documentation
        shell: bash
        run: |
          set -o pipefail
          mvn -DskipTests=true smart-doc:grpc-html 2>&1 \
            | tee logs/grpc-html.log

      - name: Generate gRPC Markdown Documentation
        shell: bash
        run: |
          set -o pipefail
          mvn -DskipTests=true smart-doc:grpc-markdown 2>&1 \
            | tee logs/grpc-markdown.log

      - name: Upload gRPC API Documentation
        uses: actions/upload-artifact@v6
        with:
          name: grpc-api-doc-${{ runner.os }}
          path: ${{ github.workspace }}/target/doc/
          if-no-files-found: error

      - name: Upload gRPC API Documentation Log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-log-${{ runner.os }}-grpc-api-doc
          path: logs